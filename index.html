<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F1ED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Bricolage Grotesque carries every headline and every big figure: a
         variable grotesque with real character (flared stems, tight apertures,
         an optical-size axis) that holds up at 52px on a flat green panel.
         Geist runs the interface — a clean grotesque with true tabular figures,
         which the ledger columns depend on. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600;700&display=swap"
    />
    <!-- connect-src is the line that matters: this app's whole claim is that a
         screenshot is read on the device and never sent anywhere. Everything
         else is documentation; this is the browser enforcing it. Supabase is
         the only backend, fonts are Google's, and /api/* is same-origin.
         blob: and wasm-unsafe-eval are for Tesseract, which runs its WASM core
         in a Worker built from a blob — all of it served from /tesseract/. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:;
               worker-src 'self' blob:;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com;
               img-src 'self' data: blob:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com;
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-ancestors 'none'"
    />
    <title>Hisaab</title>
    <!-- Before first paint, or the app flashes light then swaps to dark.
         Guarded: this is the last statement in <head>, and a browser with
         storage blocked would otherwise throw here. The light palette is
         defined on bare :root, so a throw leaves the app correctly light. -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 30rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 1.5rem">Hisaab needs JavaScript</h1>
        <p>
          Your screenshots are read on this device rather than on a server, which is
          work only the browser can do. Turn JavaScript on for this site and reload.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
